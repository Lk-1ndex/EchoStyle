# 大模型 API 配置 (支持 OpenAI 兼容格式，如 DeepSeek, Claude, GPT-4o, Qwen, Ollama 等)
llm:
  api_key: "your-api-key-here"
  base_url: "https://api.deepseek.com/v1"  # 默认使用 DeepSeek，也可换成任何兼容地址
  model: "deepseek-chat"
  temperature: 0.7
  max_tokens: 4096

# 独立 Holdout 评测裁判配置 (留空则默认复用 llm 配置，但独立实例化并使用 temperature=0.0 进行流程隔离；支持不同模型如 claude / gpt-4o 实现跨模型盲审)
evaluator:
  api_key: ""
  base_url: ""
  model: ""
  temperature: 0.0
  max_tokens: 4096

# 向量 Embedding 模型配置 (支持 OpenAI 兼容格式，用于 Dense 与 Hybrid RAG 检索)
embedding:
  api_key: ""                            # 留空则默认复用 llm.api_key
  base_url: ""                           # 留空则默认复用 llm.base_url
  model: "text-embedding-3-small"        # 向量模型名称

# 多智能体调度与状态机配置
agent:
  max_reflections: 2                     # Critic Agent 触发重写的最大自省反思轮次
  quality_threshold: 80.0                # 成品合格质量分阈值 (低于则触发反思重写)

# 解析与清洗配置
extractor:
  pdf_engine: "auto"  # 可选: "auto" (按版面选择)、"markitdown" (极速模式) 或 "mineru" (深度视觉模式)
  mineru_command: "mineru-kit"
  mineru_tier: "basic"  # basic 约需 2 GB 内存；standard 约需 8 GB 内存（高质量但更吃内存）
  clean_noise: true
  repair_linebreaks: true
